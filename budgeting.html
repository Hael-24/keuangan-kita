<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budgeting - Keuangan Kita</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* Styling khusus untuk Tabel Budgeting */
    .budget-table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 12px;
    }
    .budget-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }
    .budget-table th, .budget-table td {
      padding: 12px 14px;
      border-bottom: 1px solid #1e293b;
    }
    .budget-table th {
      background: #1e293b;
      color: #38bdf8;
      font-weight: 600;
    }
    .budget-table tr:hover {
      background: rgba(30, 41, 59, 0.5);
    }
    /* Indicator Row */
    .status-completed {
      background: rgba(74, 222, 128, 0.1) !important;
    }
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-match {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid #4ade80;
    }
    .badge-pending {
      background: rgba(248, 113, 113, 0.15);
      color: #f87171;
      border: 1px solid #f87171;
    }
    .action-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-weight: 600;
      padding: 4px 8px;
    }
    .action-btn.delete {
      color: #f87171;
    }
  </style>
</head>
<body>
  <!-- HEADER NAVBAR -->
  <header class="topbar">
    <div class="brand-wrapper">
      <img src="logo.png" alt="Logo" class="app-logo" style="height:36px; width:auto;" onerror="this.style.display='none'">
      <div>
        <h1>Keuangan Kita</h1>
        <p>Budgeting & Perencanaan Keuangan</p>
      </div>
    </div>
    <div class="topbar-actions">
      <nav class="nav-links">
        <a href="index.html" class="nav-btn" style="text-decoration:none;">Dashboard</a>
        <a href="index.html" class="nav-btn" style="text-decoration:none;">Tabungan</a>
        <a href="index.html" class="nav-btn" style="text-decoration:none;">Keuangan Date</a>
        <a href="index.html" class="nav-btn" style="text-decoration:none;">Keuangan Fany</a>
        <a href="budgeting.html" class="nav-btn active" style="text-decoration:none;">Budgeting</a>
      </nav>
      <button id="logoutBtn" type="button" class="ghost">Keluar</button>
    </div>
  </header>

  <!-- KONTEN UTAMA -->
  <main class="container">
    <div class="toolbar">
      <div>
        <label>Bulan Periode Budget</label>
        <input id="month" type="month">
      </div>
      <button type="button" id="addBudgetBtn">+ Masukkan Budget</button>
    </div>

    <!-- CARD RINGKASAN & TABEL BUDGET -->
    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2>Daftar Target & Realisasi Budget</h2>
        <span id="budgetSummaryText" style="font-size: 13px; color: #94a3b8;">Total Budget: Rp0</span>
      </div>

      <div class="budget-table-wrapper">
        <table class="budget-table">
          <thead>
            <tr>
              <th style="width: 50px; text-align: center;">No</th>
              <th>Nama Budget</th>
              <th style="text-align: right;">Jumlah Budget</th>
              <th style="text-align: right;">Realisasi</th>
              <th style="text-align: center;">Status Target</th>
              <th style="text-align: center;">Aksi</th>
            </tr>
          </thead>
          <tbody id="budgetTableBody">
            <tr>
              <td colspan="6" style="text-align:center; color:#94a3b8;">Memuat data budget...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MODAL DIALOG INPUT / EDIT BUDGET -->
  <dialog id="budgetDialog">
    <form method="dialog" id="budgetForm">
      <h2 id="dialogTitle">Tambah Budget</h2>
      <input type="hidden" id="budgetId">

      <label>Nama Budget
        <input id="budgetName" type="text" placeholder="Contoh: Belanja Bulanan / Tabungan Emas" required>
      </label>

      <label>Jumlah Target Budget (Rp)
        <input id="budgetTarget" type="number" min="0" step="1000" placeholder="Contoh: 1000000" required>
      </label>

      <label>Nominal Realisasi (Rp)
        <input id="budgetRealization" type="number" min="0" step="1000" placeholder="Isi nominal jika sudah teralisasi" value="0">
      </label>

      <div class="dialogActions" style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
        <button type="button" id="cancelBtn" class="ghost">Batal</button>
        <button type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <script>
    // Konfigurasi Supabase
    const SUPABASE_URL = "https://hlyzobxyijwndohxwhuo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXpvYnh5aWp3bmRvaHh3aHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjQ5NzksImV4cCI6MjEwMzA0MDk3OX0.4eAwD2XB0OMBaoe0wcXHgi7b42r4B8GC6qV2iU6mTIE";

    let sb = null, budgets = [];
    const $ = id => document.getElementById(id);
    const rupiah = n => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);
    const today = new Date();

    $("month").value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;

    // Inisialisasi Supabase Client & Cek Sesi Auth
    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      sb.auth.getSession().then(({ data }) => {
        if (data?.session) {
          loadBudgets();
        } else {
          window.location.href = "index.html";
        }
      });
    } catch(e) { console.error(e); }

    $("logoutBtn").onclick = () => sb.auth.signOut().then(() => window.location.href = "index.html");
    $("month").onchange = loadBudgets;

    // Buka Modal Tambah
    $("addBudgetBtn").onclick = () => {
      $("budgetForm").reset();
      $("budgetId").value = "";
      $("budgetRealization").value = "0";
      $("dialogTitle").textContent = "Tambah Budget Baru";
      $("budgetDialog").showModal();
    };

    $("cancelBtn").onclick = () => $("budgetDialog").close();

    // Simpan / Edit Budget ke Supabase
    $("budgetForm").onsubmit = async (e) => {
      e.preventDefault();
      const { data: { user } } = await sb.auth.getUser();
      const budgetId = $("budgetId").value;
      const selectedMonth = $("month").value;

      const row = {
        user_id: user.id,
        date: `${selectedMonth}-01`, // Disimpan di awal bulan
        type: "expense",
        amount: Number($("budgetTarget").value),
        category: "Budgeting",
        wallet: "budgeting",
        note: JSON.stringify({
          name: $("budgetName").value.trim(),
          realization: Number($("budgetRealization").value || 0)
        })
      };

      let res = budgetId 
        ? await sb.from("transactions").update(row).eq("id", budgetId)
        : await sb.from("transactions").insert(row);

      if (res.error) {
        alert("Gagal menyimpan data budget: " + res.error.message);
      } else {
        $("budgetForm").reset();
        $("budgetDialog").close();
        loadBudgets();
      }
    };

    // Ambil Data Budget dari Supabase
    async function loadBudgets() {
      const selectedMonth = $("month").value;
      const startDate = `${selectedMonth}-01`;
      const endDate = `${selectedMonth}-31`;

      const { data, error } = await sb
        .from("transactions")
        .select("*")
        .eq("wallet", "budgeting")
        .gte("date", startDate)
        .lte("date", endDate)
        .order("id", { ascending: true });

      if (error) {
        console.error(error);
        $("budgetTableBody").innerHTML = `<tr><td colspan="6" style="text-align:center; color:#f87171;">Gagal memuat data.</td></tr>`;
        return;
      }

      budgets = data || [];
      renderTable();
    }

    // Render Tabel Budgeting
    function renderTable() {
      const tbody = $("budgetTableBody");
      
      if (budgets.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">Belum ada target budget pada periode ini. Klik tombol "+ Masukkan Budget" untuk menambahkan.</td></tr>`;
        $("budgetSummaryText").textContent = "Total Budget: Rp0";
        return;
      }

      let totalTarget = 0;
      let totalRealization = 0;

      tbody.innerHTML = budgets.map((item, index) => {
        let name = "Budget";
        let realization = 0;

        // Parsing note yang berisi JSON metadata
        try {
          const parsed = JSON.parse(item.note);
          name = parsed.name || item.note;
          realization = Number(parsed.realization || 0);
        } catch (e) {
          name = item.note || "Budget";
          realization = 0;
        }

        const target = item.amount;
        totalTarget += target;
        totalRealization += realization;

        // Cek Apakah Budget Terpenuhi (Sama/Melebihi Realisasi)
        const isMatched = realization >= target && target > 0;

        return `
          <tr class="${isMatched ? 'status-completed' : ''}">
            <td style="text-align: center; font-weight:600;">${index + 1}</td>
            <td style="font-weight:600; color:#f8fafc;">${escapeHtml(name)}</td>
            <td style="text-align: right; color:#38bdf8; font-weight:700;">${rupiah(target)}</td>
            <td style="text-align: right; color:#cbd5e1; font-weight:600;">${rupiah(realization)}</td>
            <td style="text-align: center;">
              ${isMatched 
                ? '<span class="badge-status badge-match">✓ Sesuai Target</span>' 
                : '<span class="badge-status badge-pending">⏳ Belum Sesuai</span>'}
            </td>
            <td style="text-align: center;">
              <button class="action-btn" onclick="editBudget(${item.id})">Edit</button>
              <button class="action-btn delete" onclick="deleteBudget(${item.id})">Hapus</button>
            </td>
          </tr>
        `;
      }).join("");

      $("budgetSummaryText").textContent = `Total Budget Target: ${rupiah(totalTarget)} | Terrealisasi: ${rupiah(totalRealization)}`;
    }

    // Modal Edit Data
    window.editBudget = (id) => {
      const item = budgets.find(b => b.id == id);
      if (!item) return;

      let name = "";
      let realization = 0;

      try {
        const parsed = JSON.parse(item.note);
        name = parsed.name || "";
        realization = parsed.realization || 0;
      } catch (e) {
        name = item.note || "";
      }

      $("budgetId").value = item.id;
      $("budgetName").value = name;
      $("budgetTarget").value = item.amount;
      $("budgetRealization").value = realization;

      $("dialogTitle").textContent = "Edit Budget";
      $("budgetDialog").showModal();
    };

    // Hapus Data
    window.deleteBudget = async (id) => {
      if (!confirm("Yakin ingin menghapus item budget ini?")) return;
      const { error } = await sb.from("transactions").delete().eq("id", id);
      if (error) alert("Gagal menghapus: " + error.message);
      else loadBudgets();
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
    }
  </script>
</body>
</html>
