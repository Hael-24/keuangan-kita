<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Budgeting - Keuangan Kita</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .budget-table-wrapper {
      width: 100%;
      overflow-x: auto;
      margin-top: 12px;
    }
    .budget-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      text-align: left;
    }
    .budget-table th, .budget-table td {
      padding: 10px 12px;
      border-bottom: 1px solid #1e293b;
      vertical-align: middle;
    }
    .budget-table th {
      background: #1e293b;
      color: #38bdf8;
      font-weight: 600;
    }
    .budget-table tr:hover {
      background: rgba(30, 41, 59, 0.5);
    }
    .status-completed {
      background: rgba(74, 222, 128, 0.1) !important;
    }
    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .badge-match {
      background: rgba(74, 222, 128, 0.2);
      color: #4ade80;
      border: 1px solid #4ade80;
    }
    .badge-pending {
      background: rgba(248, 113, 113, 0.15);
      color: #f87171;
      border: 1px solid #f87171;
    }
    .action-btn {
      background: transparent;
      border: none;
      color: #38bdf8;
      cursor: pointer;
      font-weight: 600;
      padding: 4px 8px;
    }
    .action-btn.delete {
      color: #f87171;
    }
    /* Input Realisasi di Dalam Tabel */
    .table-input-realization {
      width: 130px;
      padding: 6px 8px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 6px;
      color: #f8fafc;
      text-align: right;
      font-weight: 600;
      margin: 0;
    }
    .table-input-realization:focus {
      outline: none;
      border-color: #0284c7;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand-wrapper">
      <img src="logo.png" alt="Logo" class="app-logo" style="height:36px; width:auto;" onerror="this.style.display='none'">
      <div>
        <h1>Keuangan Kita</h1>
        <p>Budgeting & Perencanaan Keuangan</p>
      </div>
    </div>
    <div class="topbar-actions">
      <nav class="nav-links">
        <a href="index.html" class="nav-btn" style="text-decoration:none;">Dashboard</a>
        <a href="index.html" class="nav-btn" style="text-decoration:none;">Tabungan</a>
        <a href="index.html" class="nav-btn" style="text-decoration:none;">Date</a>
        <a href="index.html" class="nav-btn" style="text-decoration:none;">Fany</a>
        <a href="budgeting.html" class="nav-btn active" style="text-decoration:none;">Budgeting</a>
      </nav>
      <button id="logoutBtn" type="button" class="ghost">Keluar</button>
    </div>
  </header>

  <main class="container">
    <div class="toolbar">
      <div>
        <label>Bulan Periode Budget</label>
        <input id="month" type="month">
      </div>
      <button type="button" id="addBudgetBtn">+ Masukkan Budget</button>
    </div>

    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
        <h2>Daftar Target & Realisasi Budget</h2>
        <span id="budgetSummaryText" style="font-size: 13px; color: #94a3b8;">Total Budget: Rp0</span>
      </div>

      <div class="budget-table-wrapper">
        <table class="budget-table">
          <thead>
            <tr>
              <th style="width: 40px; text-align: center;">No</th>
              <th>Nama Budget</th>
              <th style="text-align: right;">Jumlah Budget</th>
              <th style="text-align: right; width: 160px;">Realisasi (Rp)</th>
              <th style="text-align: center;">Status Target</th>
              <th style="text-align: center; width: 120px;">Aksi</th>
            </tr>
          </thead>
          <tbody id="budgetTableBody">
            <tr>
              <td colspan="6" style="text-align:center; color:#94a3b8;">Memuat data budget...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- MODAL HANYA NAMA DAN JUMLAH TARGET BUDGET -->
  <dialog id="budgetDialog">
    <form method="dialog" id="budgetForm">
      <h2 id="dialogTitle">Tambah Budget Baru</h2>
      <input type="hidden" id="budgetId">

      <label>Nama Budget
        <input id="budgetName" type="text" placeholder="Contoh: Belanja Bulanan / Listrik" required>
      </label>

      <label>Jumlah Target Budget (Rp)
        <input id="budgetTarget" type="number" min="1" step="1000" placeholder="Contoh: 500000" required>
      </label>

      <div class="dialogActions" style="display:flex; justify-content:flex-end; gap:8px; margin-top:16px;">
        <button type="button" id="cancelBtn" class="ghost">Batal</button>
        <button type="submit">Simpan</button>
      </div>
    </form>
  </dialog>

  <script>
    const SUPABASE_URL = "https://hlyzobxyijwndohxwhuo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhseXpvYnh5aWp3bmRvaHh3aHVvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc0NjQ5NzksImV4cCI6MjEwMzA0MDk3OX0.4eAwD2XB0OMBaoe0wcXHgi7b42r4B8GC6qV2iU6mTIE";

    let sb = null, budgets = [];
    const $ = id => document.getElementById(id);
    const rupiah = n => new Intl.NumberFormat("id-ID", { style: "currency", currency: "IDR", maximumFractionDigits: 0 }).format(n);
    const today = new Date();

    $("month").value = `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;

    try {
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      sb.auth.getSession().then(({ data }) => {
        if (data?.session) {
          loadBudgets();
        } else {
          window.location.href = "index.html";
        }
      });
    } catch(e) { console.error(e); }

    $("logoutBtn").onclick = () => sb.auth.signOut().then(() => window.location.href = "index.html");
    $("month").onchange = loadBudgets;

    $("addBudgetBtn").onclick = () => {
      $("budgetForm").reset();
      $("budgetId").value = "";
      $("dialogTitle").textContent = "Tambah Budget Baru";
      $("budgetDialog").showModal();
    };

    $("cancelBtn").onclick = () => $("budgetDialog").close();

    // Simpan Data Budget (Nama & Jumlah Target Saja)
    $("budgetForm").onsubmit = async (e) => {
      e.preventDefault();
      const { data: { user } } = await sb.auth.getUser();
      const budgetId = $("budgetId").value;
      const selectedMonth = $("month").value;

      // Ambil realisasi lama jika ini proses edit nama/target
      let currentRealization = 0;
      if (budgetId) {
        const existingItem = budgets.find(b => b.id == budgetId);
        if (existingItem) {
          try {
            const parsed = JSON.parse(existingItem.note);
            currentRealization = parsed.realization || 0;
          } catch(e){}
        }
      }

      const row = {
        user_id: user.id,
        date: `${selectedMonth}-01`,
        type: "expense",
        amount: Number($("budgetTarget").value),
        category: "Budgeting",
        wallet: "hilal", // Menggunakan 'hilal' agar lolos database constraint
        note: JSON.stringify({
          is_budget: true,
          name: $("budgetName").value.trim(),
          realization: currentRealization
        })
      };

      let res = budgetId 
        ? await sb.from("transactions").update(row).eq("id", budgetId)
        : await sb.from("transactions").insert(row);

      if (res.error) {
        alert("Gagal menyimpan data budget: " + res.error.message);
      } else {
        $("budgetForm").reset();
        $("budgetDialog").close();
        loadBudgets();
      }
    };

    // Update Nilai Realisasi Langsung dari Tabel
    window.updateRealization = async (id, newRealizationValue) => {
      const item = budgets.find(b => b.id == id);
      if (!item) return;

      let name = "Budget";
      try {
        const parsed = JSON.parse(item.note);
        name = parsed.name || "Budget";
      } catch(e){}

      const updatedNote = JSON.stringify({
        is_budget: true,
        name: name,
        realization: Number(newRealizationValue || 0)
      });

      const { error } = await sb
        .from("transactions")
        .update({ note: updatedNote })
        .eq("id", id);

      if (error) {
        alert("Gagal memperbarui realisasi: " + error.message);
      } else {
        loadBudgets();
      }
    };

    // Ambil Data Budget
    async function loadBudgets() {
      const selectedMonth = $("month").value;
      const startDate = `${selectedMonth}-01`;
      const endDate = `${selectedMonth}-31`;

      const { data, error } = await sb
        .from("transactions")
        .select("*")
        .eq("category", "Budgeting")
        .gte("date", startDate)
        .lte("date", endDate)
        .order("id", { ascending: true });

      if (error) {
        console.error(error);
        $("budgetTableBody").innerHTML = `<tr><td colspan="6" style="text-align:center; color:#f87171;">Gagal memuat data.</td></tr>`;
        return;
      }

      // Filter khusus yang memiliki flag is_budget
      budgets = (data || []).filter(item => {
        try {
          const parsed = JSON.parse(item.note);
          return parsed.is_budget === true;
        } catch(e) {
          return false;
        }
      });

      renderTable();
    }

    // Render Tabel
    function renderTable() {
      const tbody = $("budgetTableBody");
      
      if (budgets.length === 0) {
        tbody.innerHTML = `<tr><td colspan="6" style="text-align:center; color:#94a3b8;">Belum ada target budget pada periode ini. Klik "+ Masukkan Budget" untuk menambahkan.</td></tr>`;
        $("budgetSummaryText").textContent = "Total Budget: Rp0";
        return;
      }

      let totalTarget = 0;
      let totalRealization = 0;

      tbody.innerHTML = budgets.map((item, index) => {
        let name = "Budget";
        let realization = 0;

        try {
          const parsed = JSON.parse(item.note);
          name = parsed.name || "Budget";
          realization = Number(parsed.realization || 0);
        } catch (e) {}

        const target = item.amount;
        totalTarget += target;
        totalRealization += realization;

        const isMatched = realization >= target && target > 0;

        return `
          <tr class="${isMatched ? 'status-completed' : ''}">
            <td style="text-align: center; font-weight:600;">${index + 1}</td>
            <td style="font-weight:600; color:#f8fafc;">${escapeHtml(name)}</td>
            <td style="text-align: right; color:#38bdf8; font-weight:700;">${rupiah(target)}</td>
            <td style="text-align: right;">
              <input type="number" 
                     class="table-input-realization" 
                     value="${realization}" 
                     min="0"
                     step="1000"
                     onchange="updateRealization(${item.id}, this.value)"
                     placeholder="0" />
            </td>
            <td style="text-align: center;">
              ${isMatched 
                ? '<span class="badge-status badge-match">✓ Sesuai Target</span>' 
                : '<span class="badge-status badge-pending">⏳ Belum Sesuai</span>'}
            </td>
            <td style="text-align: center;">
              <button class="action-btn" onclick="editBudget(${item.id})">Edit Target</button>
              <button class="action-btn delete" onclick="deleteBudget(${item.id})">Hapus</button>
            </td>
          </tr>
        `;
      }).join("");

      $("budgetSummaryText").textContent = `Total Target: ${rupiah(totalTarget)} | Terrealisasi: ${rupiah(totalRealization)}`;
    }

    window.editBudget = (id) => {
      const item = budgets.find(b => b.id == id);
      if (!item) return;

      let name = "";
      try {
        const parsed = JSON.parse(item.note);
        name = parsed.name || "";
      } catch (e) {}

      $("budgetId").value = item.id;
      $("budgetName").value = name;
      $("budgetTarget").value = item.amount;

      $("dialogTitle").textContent = "Edit Target Budget";
      $("budgetDialog").showModal();
    };

    window.deleteBudget = async (id) => {
      if (!confirm("Yakin ingin menghapus item budget ini?")) return;
      const { error } = await sb.from("transactions").delete().eq("id", id);
      if (error) alert("Gagal menghapus: " + error.message);
      else loadBudgets();
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;" }[m]));
    }
  </script>
</body>
</html>
